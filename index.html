<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>این دامنه برای فروش است</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .domain {
            font-size: 2em;
            color: #3498db;
            margin: 15px 0;
            font-weight: bold;
        }

        .contact-info {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            text-align: right;
            border-right: 4px solid #3498db;
        }

        .contact-item {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 80px;
        }

        .value {
            color: #3498db;
            direction: ltr;
            display: inline-block;
            unicode-bidi: embed;
        }

        .footer {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📢 این دامنه برای فروش است</h1>
        <div class="domain">modaresyabiran.ir</div>
        <p>در صورت تمایل به خرید این دامنه، لطفاً از طریق یکی از راه‌های زیر با ما در ارتباط باشید.</p>

        <div class="contact-info">
            <!-- در اینجا اطلاعات تماس خود را وارد کنید -->
            <div class="contact-item">
                <span class="label">📞 تلفن:</span>
                <span class="value">0935-380-1144</span>
            </div>
            <div class="contact-item">
                <span class="label">📧 ایمیل:</span>
                <span class="value">majid.zarea20@gmail.com</span>
            </div>
            <!-- اگر خواستید می‌توانید راه‌های ارتباطی دیگری هم اضافه کنید -->
            <!-- <div class="contact-item">
                <span class="label">💬 تلگرام:</span>
                <span class="value">@your_telegram</span>
            </div> -->
        </div>

        <p>منتظر تماس شما هستیم.</p>
        <div class="footer">© 2025 - تمامی حقوق محفوظ است</div>
    </div>
</body>

</html>
